x-rig:
  name: caddy

services:
  caddy:
    build: ""
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host:host-gateway"
    volumes:
      - data:/data
      - config:/config
      - webroot:/srv
    command: ["caddy", "run", "--resume"]
    environment:
      # Certificate reloads need headroom; collect before reaching the container cap.
      GOMEMLIMIT: 768MiB
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  data:
  config:
  webroot:
